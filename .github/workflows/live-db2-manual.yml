name: Live Db2 Integration Tests (Rust)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-qualification:
    name: Full Db2 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB2_IT_REPORT_DIR: ${{ github.workspace }}/db2-qualification-report
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Run full live Db2 qualification suite
        run: ./scripts/test-db2-integration.sh --full

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db2-qualification-report
          path: ${{ env.DB2_IT_REPORT_DIR }}
          if-no-files-found: warn
